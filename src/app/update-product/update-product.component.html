<div class="container">
    <div>
        <h2>Modifier un Produit :</h2>
    </div>
    <form>
        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>ID Produit</label>
            <input readonly type="text" [(ngModel)]="currentProduct.idProduct" name="idProduct" class="form-control">
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Nom Produit</label>
            <input type="text" [(ngModel)]="currentProduct.nameProduct" name="nomProduit" class="form-control">
        </div>

        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>Prix Produit</label>
            <input type="number" [(ngModel)]="currentProduct.priceProduct" name="prixProduit" class="form-control">
        </div>

        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Date création</label>
            <input type="date" [ngModel]="currentProduct.dateCreation | date: 'yyyy-MM-dd'"
                (ngModelChange)=" currentProduct.dateCreation= $event" name="dateCreation" class="form-control">
        </div>

        <select class="form-control form-control-lg" id="idCat" name="idCat" [(ngModel)]="updateIdCategory">
            @for(category of categories; track category.idCategory)
            {
            <option [value]="category.idCategory"> {{category.nameCategory}} </option>
            }
        </select>

        <div class="mt-2">
            <button type="submit" (click)="updateProduct()" class="btn btn-success">Modifer</button>
        </div>
    </form>
</div>
