<div class="container">
    <form class="form-inline">
        <div class="form-group mx-sm-3 mb-2 mt-2 ">
            <label>Nom Produit</label>
            <input type="text" class="form-control" [(ngModel)]="productName" name="productName" class="form-control">
            <button type="submit" (click)="searchProductByName()" class="btn btn-primary mb-2 ml-2">Rechercher</button>
        </div>
    </form>
    <div class="card shadow mb-4">
        <div class="card-body">
            <table class="table table-striped">
                <tr>
                    <th>Id</th>
                    <th>Nom</th>
                    <th>Prix</th>
                    <th>Date Création</th>
                    <th>Catégorie</th>
                </tr>
                @for (product of products; track product.id)
                { <tbody>
                    <tr>
                        <td>{{product.id}}</td>
                        <td>{{product.name}}</td>
                        <td>{{product.price}}</td>
                        <td>{{product.creationDate | date:'dd/MM/yyyy'}}</td>

                        @if(product.category){
                        <td>{{product.category.name}}</td> }
                        @else {
                        <td>PAS DE CATEGORIE</td>
                        }
                        <!--  
                 <td><a class="btn btn-danger" 
(click)="supprimerProduit(produit)">Supprimer</a></td>  
                 <td><a class="btn btn-success" 
[routerLink]="['/updateProduit',produit.idProduit]">Modifier</a></td> -->
                    </tr>
                </tbody>
                }
            </table>
        </div>
    </div>
</div>
