<form>
    <div [hidden]="ajout">
        <label>ID Catégorie</label>
        <input type="text" [readOnly]="!ajout" [(ngModel)]="category.id" name="id" class="form-control w-25">
    </div>
    <div>
        <label>Nom Catégorie</label>
        <input type="text" [(ngModel)]="category.name" name="name" class="form-control"
            placeholder="Entrez un nom de catégorie...">
    </div>
    <div class="mt-2">
        <button type="submit" [disabled]="!category.name" class="btn btn-success"
            (click)="saveCategory()" > {{ajout ? 'Ajouter' : 'Modifier'}} </button>
    </div>
</form>
