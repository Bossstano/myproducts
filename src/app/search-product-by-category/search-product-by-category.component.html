<div class="container">
    <div class="col-sm-4 col-md-4 col-lg-4 mb-4">
        <label>Categories </label>
        <select class="form-control form-control-lg" id="idCat" name="idCat" [(ngModel)]="IdCategory"
            (change)="onChange()">
            @for(category of categories;track category.id)
            {
            <option value="{{category.id}}"> {{category.name}} </option>
            }
        </select>
    </div>
    <div class="card shadow mb-4">
        <div class="card-body">
            <table class="table table-striped">
                <tr>
                    <th>Id</th>
                    <th>Nom</th>
                    <th>Prix</th>
                    <th>Date Création</th>
                    <th>Catégorie</th>
                </tr>
                @for (product of products; track product.id)
                {
                <tbody>
                    <tr>
                        <td>{{product.id}}</td>
                        <td>{{product.name}}</td>
                        <td>{{product.price}}</td>
                        <td>{{product.creationDate | date:'dd/MM/yyyy'}}</td>

                        @if(product.category){
                        <td>{{product.category.name}}</td> }
                        @else {
                        <td>PAS DE CATEGORIE</td>
                        }
                        <!--  
                 <td><a class="btn btn-danger" 
(click)="supprimerProduit(produit)">Supprimer</a></td>  
                 <td><a class="btn btn-success" 
[routerLink]="['/updateProduit',produit.idProduit]">Modifier</a></td> -->
                    </tr>
                </tbody>
                }
            </table>
        </div>
    </div>
</div>
